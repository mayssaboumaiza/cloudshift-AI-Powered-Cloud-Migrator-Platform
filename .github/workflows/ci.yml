name: CI

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:
    branches: ["master", "main"]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint + type check (fast — no DB needed)
  # ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint dependencies
        run: pip install ruff

      - name: Run ruff (lint)
        run: ruff check agents/ api/ configuration/ core/ pipeline/ rag/ services/ --output-format=github

      - name: Run ruff (format check)
        run: ruff format --check agents/ api/ configuration/ core/ pipeline/ rag/ services/

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Unit tests (no DB — mocked dependencies)
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          # Minimal env for tests — no real DB/LLM needed
          APP_ENV: development
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: cloud_migrator_test
          AZURE_AI_ENDPOINT: "https://fake.openai.azure.com"
          AZURE_OPENAI_ENDPOINT: "https://fake.openai.azure.com"
          AZURE_AI_API_KEY: "fake-key"
          AZURE_OPENAI_API_KEY: "fake-key"
          AZURE_MODEL: gpt-4o
          AZURE_OPENAI_DEPLOYMENT: gpt-4o
          AZURE_OPENAI_API_VERSION: "2025-01-01-preview"
          GITHUB_TOKEN: ""
          CREDENTIALS_FERNET_KEY: ""
          COOLDOWN_SECONDS: "0"
        run: |
          pytest tests/unit/ tests/contract/ -v \
            -x \
            --tb=short \
            -q

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Integration tests (with real PostgreSQL)
  # ─────────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cloud_migrator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt httpx pytest-asyncio

      - name: Run Alembic migrations
        env:
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: cloud_migrator_test
          ALEMBIC_MANAGED: "true"
          AZURE_AI_ENDPOINT: "https://fake.openai.azure.com"
          AZURE_OPENAI_ENDPOINT: "https://fake.openai.azure.com"
          AZURE_AI_API_KEY: "fake-key"
          AZURE_OPENAI_API_KEY: "fake-key"
          AZURE_MODEL: gpt-4o
          AZURE_OPENAI_DEPLOYMENT: gpt-4o
          AZURE_OPENAI_API_VERSION: "2025-01-01-preview"
          CREDENTIALS_FERNET_KEY: ""
        run: alembic upgrade head

      - name: Run integration tests
        env:
          APP_ENV: development
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: cloud_migrator_test
          AZURE_AI_ENDPOINT: "https://fake.openai.azure.com"
          AZURE_OPENAI_ENDPOINT: "https://fake.openai.azure.com"
          AZURE_AI_API_KEY: "fake-key"
          AZURE_OPENAI_API_KEY: "fake-key"
          AZURE_MODEL: gpt-4o
          AZURE_OPENAI_DEPLOYMENT: gpt-4o
          AZURE_OPENAI_API_VERSION: "2025-01-01-preview"
          GITHUB_TOKEN: ""
          CREDENTIALS_FERNET_KEY: ""
          COOLDOWN_SECONDS: "0"
        run: |
          pytest tests/integration/ -v \
            --tb=short \
            -q

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Docker build (verify image builds without errors)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          if [ -f Dockerfile ]; then
            docker build -t cloud-migrator:ci .
            echo "Docker build succeeded"
          else
            echo "No Dockerfile found — skipping Docker build"
          fi

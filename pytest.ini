[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

norecursedirs = manual_tests .git __pycache__ .venv output

# Markers for organizing tests
markers =
    slow: marks tests as slow
    agent01: tests for Agent 01 (migration planning + ReAct tools)
    agent02: tests for Agent 02 (code analysis)
    agent03: tests for Agent 03 (migration planning)
    agent04: tests for Agent 04 (IaC generation)
    agent05: tests for Agent 05 (deployment)
    integration: integration tests (requires MCP servers)
